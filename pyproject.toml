[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real Jellyfin/TMDB from config.env (opt-in: pytest -m live)"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
