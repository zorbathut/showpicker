<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showpicker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <h1>Showpicker</h1>
    <div class="search">
      <input id="q" type="search" placeholder="Add a movie or series… (paste a list, one per line)" autocomplete="off" spellcheck="false">
      <ul id="suggest" hidden></ul>
    </div>
    <div class="tools">
      <button id="present" type="button" title="Fullscreen gallery (←/→ titles, ↑/↓ scroll, Esc exit)">▶ Present</button>
      <button id="pick" type="button" title="Let fate decide">🎲 Pick one</button>
      <button id="clear" type="button" title="Remove everything">Clear</button>
    </div>
  </header>

  <div id="status" hidden></div>
  <div id="notice" hidden></div>
  <main id="grid"></main>
  <p id="empty" hidden>Type a title above to start a lineup.</p>

  <div id="show" hidden>
    <div class="show-bg"></div>
    <div class="show-scroll" tabindex="-1">
      <header class="show-band">
        <img class="show-logo" alt="">
        <h2 class="show-name">Title</h2>
        <div class="show-meta"></div>
        <p class="show-tagline"><span class="show-tagline-text"></span> <button type="button" class="hide" data-act="hide" title="Hide the tagline (spoiler)">⊘</button></p>
      </header>
      <div class="show-gallery"></div>
    </div>
    <div class="show-counter"></div>
    <button class="show-prev" type="button" title="Previous title (←)">◀</button>
    <button class="show-next" type="button" title="Next title (→)">▶</button>
    <button class="show-close" type="button" title="Exit (Esc)">✕</button>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
